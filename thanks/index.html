<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank You — Become AI Native</title>
  <meta name="description" content="Thanks for applying to a Become AI Native cohort.">
  <meta name="robots" content="noindex">
  <!-- Open Graph / Twitter card -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Become AI Native">
  <meta property="og:title" content="Thank You — Become AI Native">
  <meta property="og:description" content="Thanks for applying to a Become AI Native cohort.">
  <meta property="og:url" content="https://becomeainative.io/thanks/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Thank You — Become AI Native">
  <meta name="twitter:description" content="Thanks for applying to a Become AI Native cohort.">
  <link rel="icon" type="image/svg+xml" href="/shared/favicon.svg">
  <!-- Google Analytics 4 + cookie consent (gtag.js loads only after Accept) -->
  <link rel="stylesheet" href="/shared/consent.css">
  <script src="/shared/consent.js"></script>
  <link rel="stylesheet" href="/shared/site.css?v=7">
</head>
<body>
<header class="header">
  <div class="container">
    <a href="/" class="logo" aria-label="Become AI Native, home">
      <span class="logo__word">become</span>
      <span class="logo__track">ai native</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="/#method">Method</a>
      <a href="/#program">Program</a>
      <a href="/#team">Team</a>
      <a href="/#apply" class="btn">Apply for Cohort <span data-cohort>3</span></a>
    </nav>
  </div>
</header>
<main class="page apply">
  <div class="container">
    <div class="form-card">
      <div class="thanks is-visible" role="status">
        <svg class="tick" width="64" height="54" viewBox="0 0 40 34" aria-hidden="true"><path d="M4 18 L14 28 L36 4" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <h1 class="thanks__title">Application received.</h1>
        <p class="muted">We'll review your application for Cohort <span data-cohort>3</span> and reply to you personally by email.</p>
        <a class="btn-ghost" href="/">← Back to home</a>
      </div>
    </div>
  </div>
</main>
<footer class="footer">
  <div class="container">
    <a href="/" class="logo" aria-label="Become AI Native, home">
      <span class="logo__word">become</span>
      <span class="logo__track">ai native</span>
    </a>
    <div class="label label--sm">Managers first. More professions next. · becomeainative.io</div>
    <nav class="footer__links label label--sm" aria-label="Footer"><a href="__LINKEDIN__" rel="noopener">Connect on LinkedIn</a><a href="/privacy/">Privacy</a></nav>
  </div>
</footer>
<script src="/shared/site.js?v=7"></script>
  <script>
    // Count a GA4 lead only when the visitor arrives here from the application form (flag set in site.js).
    try {
      if (sessionStorage.getItem("bain_lead") === "1") {
        sessionStorage.removeItem("bain_lead");
        gtag("event", "generate_lead", { form_name: "application" });
      }
    } catch (e) {}
  </script>
</body>
</html>
