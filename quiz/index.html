<style>
@font-face{font-family:'Schibsted Grotesk';font-style:normal;font-weight:400 800;font-display:swap;src:url(/shared/fonts/schibsted-grotesk-latin.woff2) format('woff2')}
@font-face{font-family:'Caveat';font-style:normal;font-weight:500 700;font-display:swap;src:url(/shared/fonts/caveat-latin.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url(/shared/fonts/ibm-plex-mono-400-latin.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;src:url(/shared/fonts/ibm-plex-mono-500-latin.woff2) format('woff2')}
:root{--paper:#fff;--desk:#f4f5f7;--ink:#111;--muted:#4a4e5a;--struck:#8a8f99;--rule:#dadde3;--rule2:#b5b9c2;--pen:#1a4dff;--marker:#f6e94a;--graphite:#2b2b2b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--desk);color:var(--ink);font-family:'Schibsted Grotesk',system-ui,sans-serif;font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit}
.hand{font-family:'Caveat',cursive;font-weight:700;color:var(--pen)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:20px 20px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.logo{font-weight:800;font-size:24px;letter-spacing:-.5px;display:flex;align-items:baseline;gap:6px;text-decoration:none}
.logo .hand{font-size:26px;display:inline-block;transform:rotate(-6deg)}
.label{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);letter-spacing:.3px}

.hud{display:grid;grid-template-columns:auto 1fr auto;background:var(--paper);border:1px solid var(--rule);margin-bottom:14px}
.hud>div{padding:12px 18px}
.hud>div+div{border-left:1px solid var(--rule)}
.clock{font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:500;letter-spacing:-1px;white-space:nowrap}
.clock small{font-size:13px;color:var(--muted);display:block;letter-spacing:.3px;font-weight:400}
.days{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.day{font-family:'IBM Plex Mono',monospace;font-size:13px;padding:6px 10px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.day.on{border:2px solid var(--pen);color:var(--ink);font-weight:500}
.day.done{color:var(--ink);text-decoration:line-through;text-decoration-color:var(--pen);text-decoration-thickness:2px}
.chaos{min-width:190px}
.chaos .bar{display:flex;gap:6px;margin-top:6px}
.chaos .pip{width:46px;height:14px;border:1.5px solid var(--graphite)}
.chaos .pip.on{background:repeating-linear-gradient(-45deg,var(--graphite) 0 2px,transparent 2px 6px)}
.chaos.alarm .label{color:var(--ink);font-weight:500}

.office{display:grid;grid-template-columns:repeat(5,1fr);background:var(--paper);border:1px solid var(--rule);margin-bottom:14px}
.desk{position:relative;padding:8px 6px 10px;text-align:center;border-left:1px solid var(--rule);transition:background .2s}
.desk:first-child{border-left:0}
.desk svg{width:100%;max-width:130px;height:auto;display:block;margin:0 auto}
.desk .nick{font-size:13px;font-weight:700;line-height:1.2;margin-top:2px}
.desk.active{background:var(--desk)}
.desk.active .nick span{background:var(--marker);padding:0 3px}
.desk.active svg{animation:hop .6s ease}
@keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-10px) rotate(-3deg)}60%{transform:translateY(0) rotate(2deg)}}
.desk .bang{position:absolute;top:6px;right:12%;font-size:30px;opacity:0;transform:rotate(-8deg)}
.desk.active .bang{opacity:1}

.card{background:var(--paper);border:1px solid var(--rule);padding:30px 34px 28px;min-height:360px;position:relative}
.kicker{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);margin-bottom:10px}
h1{font-size:46px;line-height:1.05;letter-spacing:-1.5px;font-weight:800;margin-bottom:14px}
h2{font-size:30px;line-height:1.15;letter-spacing:-.8px;font-weight:800;margin-bottom:18px;max-width:780px}
h3{font-size:21px;letter-spacing:-.4px;font-weight:800;margin:26px 0 10px}
.lead{font-size:19px;color:var(--muted);max-width:640px;margin-bottom:22px}
.hl{background:var(--marker);padding:0 4px}
.opts{display:flex;flex-direction:column;gap:8px;max-width:820px}
.opt{text-align:left;padding:13px 16px 13px 18px;border:1px solid var(--rule);background:var(--paper);font-size:17px;display:flex;gap:12px;align-items:flex-start;transition:border-color .15s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .k{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);padding-top:3px;flex:none;width:16px}
.opt:disabled{cursor:default}
.opt.faded{color:var(--struck)}
.opt.picked{border:2px solid var(--pen);padding:12px 15px 12px 17px}
.opt.picked .k{color:var(--pen)}
.react{display:none;margin-top:18px;max-width:820px;border-top:1px solid var(--rule);padding-top:14px;align-items:center;gap:14px}
.react.show{display:flex}
.react svg{width:64px;height:auto;flex:none}
.react .who{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted)}
.react .say{font-family:'Caveat',cursive;font-weight:700;color:var(--pen);font-size:28px;line-height:1.1;transform:rotate(-1.5deg);transform-origin:left}
.react .cost{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);margin-left:auto;white-space:nowrap}
.row{display:flex;gap:12px;align-items:center;margin-top:22px;flex-wrap:wrap}
.btn{background:var(--ink);color:#fff;padding:13px 22px;font-weight:700;font-size:17px;border:2px solid var(--ink);text-decoration:none;display:inline-block}
.btn:hover{background:var(--pen);border-color:var(--pen)}
.btn.yellow{background:var(--marker);color:var(--ink);border-color:var(--marker)}
.btn.yellow:hover{border-color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:transparent;color:var(--pen);border-color:var(--pen)}
.btn[hidden]{display:none}
.btn:disabled{opacity:.35;cursor:default}
input[type=text],input[type=email],input[type=url],select{font:inherit;font-size:18px;padding:11px 13px;border:1px solid var(--rule2);width:100%;max-width:420px;outline:none;background:#fff;border-radius:0;color:var(--ink)}
input::placeholder{color:var(--struck)}
input:focus,select:focus{border-color:var(--pen)}
.field{margin-bottom:16px}
.field>label,.field>.label{display:block;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;max-width:820px}
.chip{border:1px solid var(--rule);padding:9px 14px;font-size:16px;background:#fff}
.chip:hover{border-color:var(--ink)}
.chip.on{border:2px solid var(--pen);padding:8px 13px;font-weight:700}
.q{margin-bottom:22px;max-width:820px}
.q>p{font-weight:700;margin-bottom:8px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;max-width:620px;margin:6px 0 4px}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--pen)}
.err{color:#b00020;font-size:14px;margin-top:6px;min-height:18px}
.note{position:absolute;right:34px;top:26px;font-size:28px;transform:rotate(-5deg);max-width:300px;text-align:right;line-height:1.05}

.guess{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:920px}
.gcard{border:1px solid var(--rule);padding:10px 8px 12px;text-align:center;background:var(--paper)}
.gcard:hover{border-color:var(--ink)}
.gcard svg{width:100%;max-width:110px;height:auto}
.gcard b{display:block;font-size:14px;line-height:1.2}
.gcard i{display:block;font-style:normal;font-size:13px;color:var(--muted);margin-top:4px;line-height:1.25}

.ledger{max-width:560px;border-top:1px solid var(--rule);margin:6px 0 10px}
.ledger div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:16px}
.ledger div span:last-child{font-family:'IBM Plex Mono',monospace;white-space:nowrap}
.ledger .tot{font-weight:800;font-size:20px;border-bottom:2px solid var(--ink)}

.res{display:grid;grid-template-columns:240px 1fr;gap:30px;align-items:start}
.res .fig{border:1px solid var(--rule);background:var(--desk);padding:14px;transform:rotate(-1.5deg);position:sticky;top:16px}
.res .fig svg{width:100%;height:auto}
.quote{font-family:'Caveat',cursive;font-weight:700;color:var(--pen);font-size:30px;line-height:1.1;margin:-4px 0 14px;transform:rotate(-1deg);transform-origin:left}
.week{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--rule);margin:14px 0 6px}
.week>div{padding:10px 12px}
.week>div+div{border-left:1px solid var(--rule)}
.week b{display:block;font-size:24px;letter-spacing:-.6px;white-space:nowrap}
.week span{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted)}
.area{margin:10px 0}
.area .top{display:flex;justify-content:space-between;font-size:15px;font-weight:700}
.area .top span:last-child{font-family:'IBM Plex Mono',monospace;font-weight:400}
.area .track{height:10px;border:1px solid var(--graphite);margin-top:4px;position:relative}
.area .fill{position:absolute;inset:0 auto 0 0;background:var(--ink);transition:width .8s ease}
.tip{border:1px dashed var(--rule2);padding:12px 14px;margin-top:8px;font-size:15px}
.tip b{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
.plan{border-top:1px solid var(--rule)}
.plan>div{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)}
.plan .wk{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--pen);padding-top:3px}
.plan b{display:block}
.plan p{font-size:15px;color:var(--muted)}
.plan .done{font-size:15px;color:var(--ink);margin-top:2px}
.next{margin-top:24px;border:2px solid var(--ink);padding:18px 20px;background:var(--desk)}
.next ul{margin:8px 0 0 18px;font-size:15px}
.next li{margin:3px 0}
.extra{border-top:1px solid var(--rule2);margin-top:12px;padding-top:10px;font-size:15px}
footer{margin-top:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade,.desk.active svg{animation:none}}

@media (max-width:760px){
  .wrap{padding:12px 10px 30px}
  .hud{grid-template-columns:1fr 1fr}
  .hud .days{grid-column:1/-1;border-left:0!important;border-top:1px solid var(--rule)}
  .hud>div{padding:10px 12px}
  .clock{font-size:24px}
  .chaos{min-width:0}
  .chaos .pip{width:32px}
  .desk .nick{font-size:11px}
  .card{padding:22px 18px;min-height:0}
  h1{font-size:34px}
  h2{font-size:23px}
  .note{position:static;text-align:left;margin:-6px 0 14px;font-size:24px;display:block}
  .guess{grid-template-columns:repeat(2,1fr)}
  .res{grid-template-columns:1fr}
  .res .fig{max-width:200px;position:static}
  .week{grid-template-columns:repeat(3,1fr)}
  .week>div:nth-child(4){border-left:0}
  .week>div:nth-child(n+4){border-top:1px solid var(--rule)}
  .react .cost{display:none}
  .plan>div{grid-template-columns:1fr;gap:2px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="pencil" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/>
    </filter>
  </defs>
</svg>

<div class="wrap">
  <header>
    <a class="logo" href="/">become <span class="hand">ai native</span></a>
    <div class="label">BAIN-QUIZ · Five colleagues, one week</div>
  </header>

  <div class="hud" id="hud">
    <div><div class="clock" id="clock"><small>CLOCK</small>MON 09:00</div></div>
    <div class="days" id="days"></div>
    <div class="chaos" id="chaosBox"><div class="label">CHAOS METER</div><div class="bar"><div class="pip"></div><div class="pip"></div></div></div>
  </div>

  <div class="office" id="office" aria-hidden="true"></div>

  <main class="card" id="card" aria-live="polite"></main>

  <footer>
    <span class="label">becomeainative.io · <a href="/privacy/">Privacy</a></span>
    <span class="label">No AI trivia, just your real work week</span>
  </footer>
</div>

<script>
/* ===== Settings =====
   WEBHOOK_URL: the n8n Webhook node (POST, JSON). Leave empty and nothing is sent: the result still shows.
   In n8n, set the webhook "Allowed Origins (CORS)" to https://becomeainative.io */
const WEBHOOK_URL = "";
const APPLY_URL = "https://form.becomeainative.io/apply";

const CAST = {
  henk:   {slug:'analog-legend',    nick:'The Analog Legend',     line:"I don't need AI. I have Excel and a good memory.", mins:120, pts:1, jump:'Worker → Operator'},
  sofia:  {slug:'copy-paste-artist',nick:'The Copy-Paste Artist', line:"Just one more prompt and it's perfect.",           mins:70,  pts:2, jump:'From Operator to Manager'},
  oksana: {slug:'workflow-wizard',  nick:'The Workflow Wizard',   line:"I automated our standup. Ask me how.",             mins:35,  pts:3, jump:'From Operator to Manager across systems'},
  kwame:  {slug:'conductor',        nick:'The Conductor',         line:"My agents handle it. I decide what matters.",      mins:10,  pts:4, jump:'Manager'},
  lukas:  {slug:'chaos-automator',  nick:'The Chaos Automator',   line:"It was supposed to email one client.",             mins:8,   pts:3, jump:'Keep the speed, add the gates'},
};
const ORDER = ['henk','sofia','oksana','kwame','lukas'];
const BASE = 390; // meetings, lunch and the rest of the day, in minutes

function figure(id){
  const g = '#2b2b2b', p = '#1a4dff';
  const head = `<path d="M60 18 a12 12 0 1 1 -1 0.2" /><path d="M61.5 17.6 a12.4 12 0 1 1 -2 0.4" stroke-width="1.2" opacity=".55"/>`;
  const body = `<path d="M60 42 L60 94"/>`;
  const desk = `<path d="M10 95 L110 95"/><path d="M11 96.5 L109 96"/><path d="M18 95 L18 132"/><path d="M102 95 L102 132"/>`;
  let arms='', props='', face='';
  if(id==='henk'){ // paper stack + mug
    arms = `<path d="M60 54 L42 74 L36 93"/><path d="M60 54 L80 72 L86 80"/>`;
    props = `<path d="M76 93 L102 93"/><path d="M77 88 L101 88.5"/><path d="M76 83 L100 82.5"/><path d="M78 78 L102 78.5"/><path d="M77 73 L99 72.5"/><path d="M79 68 L101 68.5"/>
             <path d="M22 80 L22 93 L34 93 L34 80 Z"/><path d="M34 84 q6 0 6 4 q0 3 -6 3"/><path d="M26 76 q2 -4 0 -7"/><path d="M30 76 q2 -4 0 -7"/>`;
    face = `<path d="M55 28 L57 28"/><path d="M63 28 L65 28"/><path d="M55 35 L65 35"/>`;
  }
  if(id==='sofia'){ // laptop + copy/paste
    arms = `<path d="M60 54 L72 76 L80 90"/><path d="M60 54 L50 76 L72 91"/>`;
    props = `<path d="M70 93 L104 93"/><path d="M74 92 L80 66 L106 66 L100 92"/>
             <text x="2" y="44" font-family="Caveat" font-weight="700" font-size="16" fill="${p}" stroke="none" transform="rotate(-10 20 40)">ctrl+V</text>`;
    face = `<circle cx="56" cy="28" r="1.4" fill="${g}"/><circle cx="64" cy="28" r="1.4" fill="${g}"/><path d="M55 34 q5 4 10 0"/>`;
  }
  if(id==='oksana'){ // wand + gear
    arms = `<path d="M60 54 L80 44 L96 30"/><path d="M60 54 L44 72 L40 92"/>`;
    props = `<path d="M100 14 L102 21 L109 22 L103 26 L105 33 L100 29 L94 32 L96 25 L91 21 L98 20 Z" stroke="${p}" fill="none"/>
             <circle cx="28" cy="84" r="7"/><path d="M28 74 L28 77 M28 91 L28 94 M18 84 L21 84 M35 84 L38 84 M21 77 L23 79 M33 89 L35 91 M35 77 L33 79 M21 91 L23 89"/>`;
    face = `<path d="M54 28 q2 -2 4 0"/><path d="M62 28 q2 -2 4 0"/><path d="M55 34 q5 5 10 0"/>`;
  }
  if(id==='kwame'){ // baton + agent boxes with ticks
    arms = `<path d="M60 54 L78 42 L86 30"/><path d="M60 54 L46 70 L40 90"/><path d="M86 30 L100 12"/>`;
    props = `<rect x="10" y="12" width="16" height="12"/><path d="M13 18 l3 3 l6 -6" stroke="${p}"/>
             <rect x="10" y="32" width="16" height="12"/><path d="M13 38 l3 3 l6 -6" stroke="${p}"/>
             <rect x="10" y="52" width="16" height="12"/><path d="M13 58 l3 3 l6 -6" stroke="${p}"/>`;
    face = `<circle cx="56" cy="28" r="1.4" fill="${g}"/><circle cx="64" cy="28" r="1.4" fill="${g}"/><path d="M56 35 L64 34"/>`;
  }
  if(id==='lukas'){ // arms up, lightning, flying papers
    arms = `<path d="M60 54 L44 38 L38 22"/><path d="M60 54 L76 38 L82 22"/>`;
    props = `<path d="M96 40 L88 56 L97 56 L89 74" stroke="${p}"/>
             <path d="M12 40 l14 -4 l3 11 l-14 4 z"/><path d="M90 84 l13 3 l-2 9" /><path d="M20 66 l11 -6 l5 9 l-11 6 z"/>`;
    face = `<circle cx="56" cy="28" r="2" fill="none"/><circle cx="64" cy="28" r="2" fill="none"/><ellipse cx="60" cy="35.5" rx="3" ry="2.2"/>`;
  }
  return `<svg viewBox="0 0 120 136" fill="none" stroke="${g}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="${CAST[id].nick}">
    <g filter="url(#pencil)">${props}${head}${face}${body}${arms}${desk}</g></svg>`;
}



// ===== Scenes: [character, answer, reaction] =====
const SCENES = [
 {day:0, area:'sys', q:"Monday, 9:00. 60 unread Slack messages, 12 emails, 3 new Jira tickets.", opts:[
   ['henk',"Mark all as read. If it's urgent, they'll call.","If it's urgent, they'll call. Nobody has called since 2019."],
   ['sofia',"Skim, then paste the long threads into ChatGPT for a summary.","Summary of 60 threads: “people are discussing things.”"],
   ['oksana',"My saved “Monday triage” prompt with the threads pasted in. 15 minutes.","15 minutes. I timed it. Twice."],
   ['kwame',"My agent already read Slack, Gmail and Jira and left me a brief: 4 things need me, 56 don't.","4 need me. The other 56 can wait."],
   ['lukas',"My agent replied to all 60. I'm scared to check.","In my defence, everyone got a reply."]]},
 {day:0, area:'ctx', q:"How does AI know who you are and how you work?", opts:[
   ['henk',"It doesn't, and I'd like to keep it that way.","My memory is my CLAUDE.md."],
   ['sofia',"I paste my “here's who I am” prompt at the start of every chat.","I've typed “Hi, I'm a PM” 400 times."],
   ['oksana',"A custom GPT or Claude Project with my files and instructions.","My Project knows me better than my manager does."],
   ['kwame',"A CLAUDE.md under 200 lines (who I am, how I write, never-do rules), and skills for procedures. The third time I explain something, it becomes a skill.","The third time, it becomes a skill."]]},
 {day:1, area:'sys', q:"A key client writes: “When will Feature X be available? We were told this quarter.”", opts:[
   ['henk',"I ask the PM, wait, read the roadmap, ask again, then reply.","Three days later: “Feature X is coming.”"],
   ['sofia',"ChatGPT writes a polite “I'll check and get back to you by Friday.”","Friday is a promise for future me."],
   ['oksana',"I check Jira and Confluence myself, then AI drafts the reply.","Two tabs, one answer, 40 minutes."],
   ['kwame',"My agent checks Gmail, the CRM, Jira, Confluence and Slack, shows me where they disagree, and drafts the answer. I decide.","Jira and the CRM disagree. I know before the client does."],
   ['lukas',"My agent already answered “this quarter”. It sounded very sure.","Jira moved it to next quarter 10 days ago. Small detail."]]},
 {day:1, area:'ctx', q:"You give AI a task. Your brief looks like…", opts:[
   ['henk',"I don't give AI tasks.","I don't brief. I do."],
   ['sofia',"“Make this better.”","It did. Better at what, nobody knows."],
   ['oksana',"A few lines of context and an example of what I want.","One example beats 100 words of prompt."],
   ['kwame',"Goal, inputs, output, rules: cite sources, never invent, write “Not specified” when something is missing.","Goal, inputs, output, rules. Done."]]},
 {day:2, area:'dlv', q:"You need a spec for a new feature.", opts:[

function animateClock(from, to){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ setClock(to); return; }
  const t0 = performance.now(), T = 900;
  const step = t => { const k = Math.min(1,(t-t0)/T); setClock(from + (to-from)*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function compute(){
  const total = S.picks.reduce((a,p)=>a+CAST[p.id].pts,0);
  const who = S.chaos>=2 ? 'lukas' : total<=20 ? 'henk' : total<=29 ? 'sofia' : total<=38 ? 'oksana' : 'kwame';
  const areas = {}; AREAS.forEach(([k])=>areas[k] = S.picks.filter(p=>p.area===k).reduce((a,p)=>a+CAST[p.id].pts,0));
  const busy = Math.round((48-total)/36*100);
  const fitOk = !(S.fit.years==='Under 18 months' || S.fit.time==='Not this month');
  return {total, who, areas, busy, fitOk};
}

    name:S.name, email:S.email, linkedin:S.linkedin, consent:true, consent_at:new Date().toISOString(),
    role:S.role, guess:CAST[S.guess].slug, character:CAST[R.who].slug, total:R.total, chaos:S.chaos, busywork:R.busy,
    ...R.areas, fit:R.fitOk?'yes':'no', years:S.fit.years, ai_allowed:S.fit.ai_allowed, keep_up:S.fit.keep_up, manages:S.fit.manages, time:S.fit.time,
    pain:S.pain, tools:S.tools, bonus:S.bonus, answers:S.picks.map(p=>CAST[p.id].slug), leave_times:[0,1,2,3,4].map(d=>fmt(leaveAt(d))),
    source:params.get('source')||'', utm_source:params.get('utm_source')||'', utm_campaign:params.get('utm_campaign')||'', page:location.pathname, quiz_version:'game-v1'
  };
  track('quiz_complete', {character:payload.character, fit:payload.fit});
  if(!WEBHOOK_URL){ console.info('Quiz payload (no webhook set):', payload); return; }
  fetch(WEBHOOK_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload), keepalive:true}).catch(()=>{});
}
function result(){
  const R = compute(), who = R.who, c = CAST[who], P = PLANS[who];
  send(R);
  renderOffice(who); S.day = 5; renderDays();
  const g = S.guess===who ? 'You called it. Self-awareness: 10/10.' : `You thought you were ${CAST[S.guess].nick}. Plot twist.`;
  const tips = AREAS.filter(([k])=>R.areas[k]<=4).map(([k,n,l,t])=>[`${n.toUpperCase()} · LESSONS ${l}`,t]);
  if(S.chaos>=1) tips.push(GUARDRAILS);
  const course = ['sofia','oksana','lukas'].includes(who) && R.fitOk;
  let next;
  if(who==='kwame'){
    next = `<div class="label">YOUR NEXT STEP</div><h3 style="margin-top:4px">No course for you. Take your team with you.</h3>
      <p>You already work the way our intensive ends. Send this to the managers around you, and see who they are.</p>
      <div class="row"><button class="btn" id="team">Copy link for your team</button><span class="label" id="teamOk"></span></div>`;
  } else if(course){
    const sandbox = ["It's restricted","It's not allowed"].includes(S.fit.ai_allowed);
    next = `<div class="label">YOUR NEXT STEP · ${c.jump.toUpperCase()}</div><h3 style="margin-top:4px">The intensive: 30 days, your real work, a connected agent</h3>
      <p>After 30 days you can:</p><ul>${OUTCOMES[who].map(o=>`<li>${o}</li>`).join('')}</ul>
      <ul style="margin-top:10px;list-style:none;margin-left:0">
        <li>→ 14 lessons plus 3 bonus lessons. Each: 20 min theory, about 40 min practice, a 20-min test that an AI agent checks.</li>
        <li>→ Live Wednesday sessions, recorded. No coding experience needed.</li>
        <li>→ You need a paid Claude subscription with Claude Code (from $20 a month) and a computer with admin rights.</li>
        <li>→ €2,500 excluding VAT. Next start: Monday 11 January 2027.</li></ul>
      ${sandbox?`<div class="extra"><b>Your company restricts AI?</b> Every lab runs on Sandbox, a made-up travel marketplace of 120 people with a knowledge base, about 150 Jira tickets and Slack exports. You also leave with a data policy and a rollout plan for your company.</div>`:''}
      ${S.fit.manages==='Yes'?`<div class="extra"><b>Managers report to you?</b> Bring your team: the team offer is 20% off.</div>`:''}
      <div class="row"><a class="btn yellow" href="${APPLY_URL}?page=quiz-${c.slug}" rel="noopener">Apply for the intensive</a><a class="btn ghost" href="/#program">See the program</a></div>`;
  } else {
    next = `<div class="label">YOUR NEXT STEP</div><h3 style="margin-top:4px">See it live in a Lightning Session</h3>
      <p>We take real manager tasks and do them three ways: without AI, with an assistant, and with an agent. We'll email you the next date.</p>`;
  }
  const share = `I'm ${c.nick} on the Become AI Native quiz. On Monday I left the office at ${fmt(leaveAt(0))}. Which colleague are you? https://becomeainative.io/quiz/`;
  show(`<div class="kicker">YOUR RESULT · ${esc(S.email)}</div>
    <div class="res">
      <div class="fig">${figure(who)}</div>
      <div>
        <p class="label">${nm().toUpperCase()}, YOU ARE</p>
        <h1 style="margin:2px 0 6px">${c.nick}</h1>
        <div class="quote">“${c.line}”</div>
        <p style="font-weight:700">${g}</p>
        <p style="margin-top:8px">${P.intro}</p>
        <div class="week">${[0,1,2,3,4].map(d=>`<div><b>${fmt(leaveAt(d))}</b><span>${DAYS[d]}, YOU LEFT</span></div>`).join('')}</div>
        <p class="label">BUSYWORK STILL ON YOUR PLATE: ${R.busy}% (HIGHLY UNSCIENTIFIC)</p>

        <h3>Your six areas</h3>
        ${AREAS.map(([k,n])=>`<div class="area"><div class="top"><span>${n}</span><span>${R.areas[k]}/8</span></div><div class="track"><div class="fill" style="width:0" data-w="${R.areas[k]/8*100}"></div></div></div>`).join('')}
        ${tips.map(t=>`<div class="tip"><b>${t[0]}</b>${t[1]}</div>`).join('')}

        <h3>Your 4-week plan</h3>
        <div class="plan">${P.weeks.map((w,i)=>`<div><span class="wk">WEEK ${i+1}</span><div><b>${w[0]}</b><p>${w[1]}</p><p class="done">Done when ${w[2]}</p></div></div>`).join('')}</div>
        <p class="label" style="margin-top:8px">${WEBHOOK_URL?'THE FULL PLAN IS ON ITS WAY TO YOUR INBOX':'TEST MODE: NO EMAIL IS SENT YET'}</p>

        <div class="next">${next}</div>

        <h3>Share your colleague</h3>
        <div class="row" style="margin-top:6px">
          <a class="btn ghost" href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent('https://becomeainative.io/quiz/')}" target="_blank" rel="noopener">Share on LinkedIn</a>
          <button class="btn ghost" id="copy">Copy post text</button><button class="btn ghost" id="again">Play again</button><span class="label" id="copied"></span></div>
      </div>
    </div>`);
  requestAnimationFrame(()=>document.querySelectorAll('.fill').forEach(f=>f.style.width=f.dataset.w+'%'));
  const copy = async (t, el) => { try { await navigator.clipboard.writeText(t); $(el).textContent = 'COPIED'; } catch(e){ $(el).textContent = t; } };
  $('#copy').onclick = () => copy(share, '#copied');
  $('#again').onclick = intro;
  if($('#team')) $('#team').onclick = () => copy('https://becomeainative.io/quiz/?source=team', '#teamOk');
}
intro();
</script>
