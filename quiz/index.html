<title>How AI-native are you? | Become AI Native</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://form.becomeainative.io/quiz">
<!-- /quiz/ was the old quiz (now in /quiz/old/). Send people to the new quiz and keep linkedin-id and source. -->
<script>
(function () {
  var q = new URLSearchParams(location.search), u = new URL("https://form.becomeainative.io/quiz");
  u.searchParams.set("source", q.get("source") || "website");
  if (q.get("linkedin-id")) u.searchParams.set("linkedin-id", q.get("linkedin-id"));
  location.replace(u.toString());
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://form.becomeainative.io/quiz?source=website"></noscript>
</head>
