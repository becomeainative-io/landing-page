<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta property="og:description" content="A 4-minute work-week game for managers. Which colleague are you?">

<!-- Google Analytics 4 + cookie consent (gtag.js loads only after Accept) -->
<link rel="stylesheet" href="/shared/consent.css">
<script src="/shared/consent.js?v=2"></script>

<style>
@font-face{font-family:'Schibsted Grotesk';font-style:normal;font-weight:400 800;font-display:swap;src:url(/shared/fonts/schibsted-grotesk-latin.woff2) format('woff2')}
@font-face{font-family:'Caveat';font-style:normal;font-weight:500 700;font-display:swap;src:url(/shared/fonts/caveat-latin.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url(/shared/fonts/ibm-plex-mono-400-latin.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;src:url(/shared/fonts/ibm-plex-mono-500-latin.woff2) format('woff2')}
:root{--paper:#fff;--desk:#f4f5f7;--ink:#111;--muted:#4a4e5a;--struck:#8a8f99;--rule:#dadde3;--rule2:#b5b9c2;--pen:#1a4dff;--marker:#f6e94a;--graphite:#2b2b2b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--desk);color:var(--ink);font-family:'Schibsted Grotesk',system-ui,sans-serif;font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased}
a{color:inherit}
.hand{font-family:'Caveat',cursive;font-weight:700;color:var(--pen)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:18px 20px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:24px;letter-spacing:-.5px;display:flex;align-items:baseline;gap:6px;text-decoration:none}
.logo .hand{font-size:26px;display:inline-block;transform:rotate(-6deg)}
.label{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);letter-spacing:.3px}

/* HUD */
.hud{display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border:1px solid var(--rule);margin-bottom:12px;align-items:center}
.hud>div{padding:10px 16px}
.hud>div+div{border-left:1px solid var(--rule)}
.hud .days{grid-column:1/-1;border-bottom:1px solid var(--rule);border-left:0!important}
.hud>div:nth-child(2){border-left:0}
.days{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.day{font-family:'IBM Plex Mono',monospace;font-size:13px;padding:6px 10px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.day.on{border:2px solid var(--pen);color:var(--ink);font-weight:500}
.day.done{color:var(--ink);text-decoration:line-through;text-decoration-color:var(--pen);text-decoration-thickness:2px}
.pilebox{display:flex;align-items:center;gap:10px}
.pilebox{gap:18px;padding:12px 20px!important}
.pilebox svg{width:auto;height:96px;max-width:120px}
.pilebox #pileTxt,.chaos .ctxt{font-family:'Schibsted Grotesk',sans-serif;font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1.1;margin-top:4px}
.chaos{display:flex;align-items:center;gap:10px;transition:background .3s}
.chaos{gap:18px;padding:12px 20px!important}
.chaos svg{width:160px;height:96px;overflow:visible}
.chaos .needle{transition:transform .7s cubic-bezier(.3,1.6,.5,1);transform-origin:50px 50px}
.chaos .zone{transition:opacity .4s}
.chaos .ctxt{color:var(--ink)}
.chaos.lvl1 .ctxt{color:#e5322d}
.chaos.alarm{background:#e5322d}
.chaos.alarm .label,.chaos.alarm .ctxt{color:#fff}
.chaos.alarm svg .dial{stroke:#fff}
.chaos.alarm{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{background:#b81f1b}}
.shake{animation:shake .45s ease}
@keyframes shake{20%{transform:translate(-6px,2px) rotate(-.6deg)}40%{transform:translate(6px,-2px) rotate(.6deg)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,0)}}
.flash{position:fixed;inset:0;background:#e5322d;opacity:0;pointer-events:none;z-index:50}
.flash.go{animation:flash .6s ease}
@keyframes flash{15%{opacity:.28}100%{opacity:0}}
.desk.burn{background:#fde8e7}
.desk.burn .nick span{background:#e5322d;color:#fff;padding:0 3px}
.ocard.red.picked{border-color:#e5322d}
.react.red .say{color:#e5322d}
.alert{display:flex;gap:12px;align-items:center;margin-top:14px;background:#e5322d;color:#fff;padding:12px 16px;font-size:15px;animation:fade .35s ease}
.alert b{font-family:'IBM Plex Mono',monospace;font-weight:500;white-space:nowrap}
.chaos.hit{outline:3px solid #e5322d;outline-offset:-3px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:640px;margin:-6px 0 20px}
.legend div{border:1px dashed var(--rule2);padding:10px 12px;font-size:14px;color:var(--muted)}
.legend b{display:block;color:var(--ink);font-size:15px}
@media (max-width:760px){.legend{grid-template-columns:1fr}}
.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.18) rotate(-4deg)}}

/* office */
.office{display:grid;grid-template-columns:repeat(5,1fr);background:var(--paper);border:1px solid var(--rule);margin-bottom:12px}
.desk{position:relative;padding:6px 6px 8px;text-align:center;border-left:1px solid var(--rule);transition:background .2s}
.desk:first-child{border-left:0}
.desk svg{width:100%;max-width:104px;height:auto;display:block;margin:0 auto}
.desk .nick{font-size:12px;font-weight:700;line-height:1.2;margin-top:2px}
.desk.active{background:var(--desk)}
.desk.active .nick span{background:var(--marker);padding:0 3px}
.desk.active svg{animation:hop .6s ease}
@keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-10px) rotate(-3deg)}60%{transform:translateY(0) rotate(2deg)}}
.desk .bang{position:absolute;top:4px;right:12%;font-size:28px;opacity:0;transform:rotate(-8deg)}
.desk.active .bang{opacity:1}

/* card */
.card{background:var(--paper);border:1px solid var(--rule);padding:26px 30px 26px;min-height:360px;position:relative}
.kicker{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);margin-bottom:10px}
h1{font-size:46px;line-height:1.05;letter-spacing:-1.5px;font-weight:800;margin-bottom:14px}
h2{font-size:28px;line-height:1.15;letter-spacing:-.8px;font-weight:800;margin-bottom:16px;max-width:760px}
h3{font-size:20px;letter-spacing:-.4px;font-weight:800;margin:24px 0 10px}
.lead{font-size:19px;color:var(--muted);max-width:640px;margin-bottom:20px}
.hl{background:var(--marker);padding:0 4px}
.note{position:absolute;right:30px;top:24px;font-size:28px;transform:rotate(-5deg);max-width:300px;text-align:right;line-height:1.05}

/* scene */
.scene{display:grid;grid-template-columns:300px 1fr;gap:26px;align-items:start}
.panel{border:1px solid var(--rule);background:var(--desk);padding:8px;transform:rotate(-1deg)}
.panel svg{width:100%;height:auto;display:block}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ocard{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border:1px solid var(--rule);background:#fff;min-height:84px;transition:border-color .15s, transform .15s}
.ocard:hover:not(:disabled){border-color:var(--ink);transform:rotate(-.6deg)}
.ocard svg{width:40px;height:40px;flex:none}
.ocard b{display:block;font-size:17px;line-height:1.2;letter-spacing:-.2px}
.ocard span{display:block;font-size:14px;color:var(--muted);margin-top:3px;line-height:1.3}
.ocard:disabled{cursor:default}
.ocard.faded{opacity:.35}
.ocard.picked{border:2px solid var(--pen);padding:11px 13px;transform:rotate(-1deg)}
.react{display:none;margin-top:14px;border-top:1px solid var(--rule);padding-top:12px;align-items:center;gap:14px}
.react.show{display:flex}
.react svg{width:64px;height:auto;flex:none}
.react .who{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted)}
.react .say{font-family:'Caveat',cursive;font-weight:700;color:var(--pen);font-size:28px;line-height:1.1;transform:rotate(-1.5deg);transform-origin:left}
.react .cost{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);white-space:nowrap}
.row{display:flex;gap:12px;align-items:center;margin-top:18px;flex-wrap:wrap}
.btn{background:var(--ink);color:#fff;padding:13px 22px;font-weight:700;font-size:17px;border:2px solid var(--ink);text-decoration:none;display:inline-block}
.btn:hover{background:var(--pen);border-color:var(--pen)}
.btn.yellow{background:var(--marker);color:var(--ink);border-color:var(--marker)}
.btn.yellow:hover{border-color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{color:var(--pen);border-color:var(--pen)}
.btn[hidden]{display:none}
.skip{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);text-decoration:underline}
input[type=text],input[type=email],input[type=url],select{font:inherit;font-size:18px;padding:11px 13px;border:1px solid var(--rule2);width:100%;max-width:420px;outline:none;background:#fff;border-radius:0;color:var(--ink)}
input::placeholder{color:var(--struck)}
input:focus,select:focus{border-color:var(--pen)}
.field{margin-bottom:14px}
.field>label{display:block;margin-bottom:6px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;max-width:620px;margin:6px 0 4px}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--pen)}
.err{color:#b00020;font-size:14px;margin-top:6px;min-height:18px}

/* big choice tiles (fit) */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;max-width:880px}
.tile{border:1px solid var(--rule);background:#fff;padding:14px 14px 16px;text-align:left;font-weight:700;font-size:17px;line-height:1.25;display:flex;flex-direction:column;gap:8px;min-height:96px}
.tile svg{width:38px;height:38px}
.tile:hover{border-color:var(--ink)}
.tile.on{border:2px solid var(--pen);padding:13px 13px 15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;max-width:820px}
.chip{border:1px solid var(--rule);padding:10px 16px;font-size:17px;background:#fff}
.chip:hover{border-color:var(--ink)}
.chip.on{border:2px solid var(--pen);padding:9px 15px;font-weight:700}
.dots{display:flex;gap:6px;margin-bottom:12px}
.dots i{width:28px;height:4px;background:var(--rule)}
.dots i.on{background:var(--pen)}

.guess{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:920px}
.gcard{border:1px solid var(--rule);padding:10px 8px 12px;text-align:center;background:var(--paper)}
.gcard:hover{border-color:var(--ink)}
.gcard svg{width:100%;max-width:110px;height:auto}
.gcard b{display:block;font-size:14px;line-height:1.2}

/* day stamp */
.stamp{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:300px;gap:6px}
.stamp .big{font-family:'Caveat',cursive;font-weight:700;color:var(--pen);font-size:64px;line-height:1;transform:rotate(-4deg)}
.stamp svg{width:200px;height:auto;max-height:200px}

/* result */
.res{display:grid;grid-template-columns:230px 1fr;gap:28px;align-items:start}
.res .fig{border:1px solid var(--rule);background:var(--desk);padding:12px;transform:rotate(-1.5deg)}
.res .fig svg{width:100%;height:auto}
.quote{font-family:'Caveat',cursive;font-weight:700;color:var(--pen);font-size:30px;line-height:1.1;margin:-4px 0 10px;transform:rotate(-1deg);transform-origin:left}
.meters{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--rule)}
.meters>div{padding:10px 12px;border-left:1px solid var(--rule);border-top:1px solid var(--rule)}
.meters>div:nth-child(3n+1){border-left:0}
.meters>div:nth-child(-n+3){border-top:0}
.meters b{display:block;font-size:14px}
.meters .pips{display:flex;gap:3px;margin-top:6px}
.meters .pips i{flex:1;height:9px;border:1.3px solid var(--graphite)}
.meters .pips i.on{background:var(--ink)}
.meters .weak b::after{content:' ← start here';font-family:'Caveat',cursive;color:var(--pen);font-size:20px;font-weight:700}
.tip{border:1px dashed var(--rule2);padding:12px 14px;margin-top:10px;font-size:15px}
.tip b{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.wk{border:1px solid var(--rule);padding:12px;background:#fff}
.wk .n{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--pen)}
.wk b{display:block;font-size:15px;line-height:1.25;margin-top:4px}
.next{margin-top:22px;border:2px solid var(--ink);padding:16px 18px;background:var(--desk)}
.next p{font-size:15px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.facts span{font-family:'IBM Plex Mono',monospace;font-size:12px;border:1px solid var(--rule2);padding:5px 8px;background:#fff}
.extra{margin-top:10px;font-size:14px}
footer{margin-top:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade,.desk.active svg,.bump,.shake,.chaos.alarm,.flash.go{animation:none}}

@media (max-width:860px){
  .scene{grid-template-columns:1fr;gap:14px}
  .panel{max-width:260px}
}
@media (max-width:760px){
  .wrap{padding:10px 10px 30px}
  .hud>div{padding:8px 10px}
  .pilebox,.chaos{flex-direction:column;align-items:flex-start;gap:6px;padding:10px!important}
  .pilebox svg{width:auto;height:62px}
  .chaos svg{width:104px;height:62px}
  .pilebox #pileTxt,.chaos .ctxt{font-size:17px}
  .desk .nick{font-size:10px}
  .card{padding:18px 14px;min-height:0}
  h1{font-size:34px}
  h2{font-size:22px}
  .note{position:static;text-align:left;margin:-4px 0 12px;font-size:24px;display:block}
  .cards{grid-template-columns:1fr}
  .ocard{min-height:0}
  .guess{grid-template-columns:repeat(2,1fr)}
  .tiles{grid-template-columns:1fr 1fr}
  .res{grid-template-columns:1fr}
  .res .fig{max-width:180px}
  .meters{grid-template-columns:1fr 1fr}
  .meters>div{border-left:1px solid var(--rule)!important;border-top:1px solid var(--rule)!important}
  .meters>div:nth-child(odd){border-left:0!important}
  .meters>div:nth-child(-n+2){border-top:0!important}
  .weeks{grid-template-columns:1fr 1fr}
  .react .cost{display:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="pencil" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/>

  </defs>
</svg>

<div class="flash" id="flash"></div>
<div class="wrap">
  <header>
    <a class="logo" href="/">become <span class="hand">ai native</span></a>
    <div class="label">BAIN-QUIZ · Five colleagues, one week</div>
  </header>

  <div class="hud">
    <div class="days" id="days"></div>
    <div class="pilebox"><span id="pileMini"></span><div><div class="label">YOUR DESK</div><div id="pileTxt">All clear</div></div></div>
    <div class="chaos" id="chaosBox"><svg viewBox="0 0 100 60" fill="none" stroke-linecap="round" aria-hidden="true">
      <g filter="url(#pencil)"><path class="dial" d="M10 50 A40 40 0 0 1 90 50" stroke="#2b2b2b" stroke-width="2.4"/>
      <path class="zone z1" d="M50 10 A40 40 0 0 1 78 22" stroke="#e5322d" stroke-width="7" opacity=".25"/>
      <path class="zone z2" d="M78 22 A40 40 0 0 1 90 50" stroke="#e5322d" stroke-width="7" opacity=".25"/>
      <path d="M10 50 h6 M50 10 v6 M90 50 h-6" stroke="#2b2b2b" stroke-width="2"/></g>
      <g class="needle" id="needle"><path d="M50 50 L50 16" stroke="#111" stroke-width="3"/><circle cx="50" cy="50" r="4.5" fill="#111"/></g>
      <text id="flame" x="84" y="14" font-size="16" opacity="0">🔥</text></svg>

  <footer>
    <span class="label">becomeainative.io · <a href="/privacy/">Privacy</a></span>
    <span class="label">No AI trivia, just your real work week</span>
  </footer>
</div>

<script>
/* ===== Settings =====
   WEBHOOK_URL: the n8n Webhook node (POST, JSON). Leave empty and nothing is sent: the result still shows.
   In n8n, set the webhook "Allowed Origins (CORS)" to https://becomeainative.io */
const WEBHOOK_URL = "";
const APPLY_URL = "https://form.becomeainative.io/apply";

const CAST = {
  henk:   {slug:'analog-legend',    nick:'The Analog Legend',     line:"I don't need AI. I have Excel and a good memory.", pile:3, pts:1, jump:'Worker → Operator'},
  sofia:  {slug:'copy-paste-artist',nick:'The Copy-Paste Artist', line:"Just one more prompt and it's perfect.",           pile:2, pts:2, jump:'From Operator to Manager'},
  oksana: {slug:'workflow-wizard',  nick:'The Workflow Wizard',   line:"I automated our standup. Ask me how.",             pile:1, pts:3, jump:'From Operator to Manager across systems'},
  kwame:  {slug:'conductor',        nick:'The Conductor',         line:"My agents handle it. I decide what matters.",      pile:0, pts:4, jump:'Manager'},
  lukas:  {slug:'chaos-automator',  nick:'The Chaos Automator',   line:"It was supposed to email one client.",             pile:0, pts:3, jump:'Keep the speed, add the gates'},
};
const ORDER = ['henk','sofia','oksana','kwame','lukas'];

function figure(id){
  const g = '#2b2b2b', p = '#1a4dff';
  const head = `<path d="M60 18 a12 12 0 1 1 -1 0.2" /><path d="M61.5 17.6 a12.4 12 0 1 1 -2 0.4" stroke-width="1.2" opacity=".55"/>`;
  const body = `<path d="M60 42 L60 94"/>`;
  const desk = `<path d="M10 95 L110 95"/><path d="M11 96.5 L109 96"/><path d="M18 95 L18 132"/><path d="M102 95 L102 132"/>`;
  let arms='', props='', face='';
  if(id==='henk'){ // paper stack + mug
    arms = `<path d="M60 54 L42 74 L36 93"/><path d="M60 54 L80 72 L86 80"/>`;
    props = `<path d="M76 93 L102 93"/><path d="M77 88 L101 88.5"/><path d="M76 83 L100 82.5"/><path d="M78 78 L102 78.5"/><path d="M77 73 L99 72.5"/><path d="M79 68 L101 68.5"/>
             <path d="M22 80 L22 93 L34 93 L34 80 Z"/><path d="M34 84 q6 0 6 4 q0 3 -6 3"/><path d="M26 76 q2 -4 0 -7"/><path d="M30 76 q2 -4 0 -7"/>`;
    face = `<path d="M55 28 L57 28"/><path d="M63 28 L65 28"/><path d="M55 35 L65 35"/>`;
  }
  if(id==='sofia'){ // laptop + copy/paste
    arms = `<path d="M60 54 L72 76 L80 90"/><path d="M60 54 L50 76 L72 91"/>`;
    props = `<path d="M70 93 L104 93"/><path d="M74 92 L80 66 L106 66 L100 92"/>
             <text x="2" y="44" font-family="Caveat" font-weight="700" font-size="16" fill="${p}" stroke="none" transform="rotate(-10 20 40)">ctrl+V</text>`;
    face = `<circle cx="56" cy="28" r="1.4" fill="${g}"/><circle cx="64" cy="28" r="1.4" fill="${g}"/><path d="M55 34 q5 4 10 0"/>`;
  }
  if(id==='oksana'){ // wand + gear
    arms = `<path d="M60 54 L80 44 L96 30"/><path d="M60 54 L44 72 L40 92"/>`;
    props = `<path d="M100 14 L102 21 L109 22 L103 26 L105 33 L100 29 L94 32 L96 25 L91 21 L98 20 Z" stroke="${p}" fill="none"/>
             <circle cx="28" cy="84" r="7"/><path d="M28 74 L28 77 M28 91 L28 94 M18 84 L21 84 M35 84 L38 84 M21 77 L23 79 M33 89 L35 91 M35 77 L33 79 M21 91 L23 89"/>`;
    face = `<path d="M54 28 q2 -2 4 0"/><path d="M62 28 q2 -2 4 0"/><path d="M55 34 q5 5 10 0"/>`;

function pile(n, w){
  const k = Math.min(n, 12), sheets = [];
  for(let i=0;i<k;i++){ const r = (i*37%7)-3, y = 76-i*6; sheets.push(`<rect x="${10+(i%3)}" y="${y}" width="60" height="6" fill="#fff" transform="rotate(${r} 40 ${y+3})"/>`); }

  const share = `I'm ${c.nick} on the Become AI Native quiz. Which colleague are you? https://becomeainative.io/quiz/`;
  show(`<div class="res">
      <div class="fig">${figure(who)}</div>
      <div>
        <p class="label">${nm().toUpperCase()}, YOU ARE</p>
        <h1 style="margin:2px 0 6px">${c.nick}</h1>
        <div class="quote">“${c.line}”</div>
        <p style="font-weight:700">${g}</p>
        <div class="row" style="margin-top:12px;gap:14px;align-items:center">${pile(S.pile,70)}<div><b style="font-size:26px">${R.busy}%</b><div class="label">BUSYWORK STILL ON YOUR DESK (HIGHLY UNSCIENTIFIC)</div></div></div>

        <h3>Your six areas</h3>
        <div class="meters">${AREAS.map(([k,n])=>`<div class="${k===weakest[0]?'weak':''}"><b>${n}</b><div class="pips">${[1,2,3,4,5,6,7,8].map(v=>`<i class="${v<=R.areas[k]?'on':''}"></i>`).join('')}</div></div>`).join('')}</div>
        <div class="tip"><b>${tip[0]}</b>${tip[1]}</div>

        <h3>Your 4-week plan</h3>
        <div class="weeks">${P.weeks.map((w,i)=>`<div class="wk"><span class="n">WEEK ${i+1}</span><b>${w[0].replace(/ \(Lessons? [^)]*\)/,'')}</b></div>`).join('')}</div>
        <p class="label" style="margin-top:8px">${WEBHOOK_URL?'THE FULL PLAN, STEP BY STEP, IS ON ITS WAY TO YOUR INBOX':'TEST MODE: NO EMAIL IS SENT YET'}</p>

        <div class="next">${next}</div>

        <div class="row">
          <a class="btn ghost" href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent('https://becomeainative.io/quiz/')}" target="_blank" rel="noopener">Share on LinkedIn</a>
          <button class="btn ghost" id="copy">Copy post text</button><button class="btn ghost" id="again">Play again</button><span class="label" id="copied"></span></div>
      </div>
    </div>`);
  const copy = async (t, el) => { try { await navigator.clipboard.writeText(t); $(el).textContent = 'COPIED'; } catch(e){ $(el).textContent = t; } };
  $('#copy').onclick = () => copy(share, '#copied');
  $('#again').onclick = intro;
  if($('#team')) $('#team').onclick = () => copy('https://becomeainative.io/quiz/?source=team', '#teamOk');
}
intro();
</script>
</body>
</html>
